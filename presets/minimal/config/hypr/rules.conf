# V9-hyprdots Rules - Hyprland WindowRule Syntax (2026)
# WindowRuleV2 is deprecated. Using windowrule with explicit booleans (e.g. float 1).

# -----------------------------------------------------
# Dialogs & File Pickers
# -----------------------------------------------------
windowrule = float 1, title:^(Open File).*$
windowrule = center 1, title:^(Open File).*$
windowrule = size 70% 60%, title:^(Open File).*$

windowrule = float 1, title:^(Select a File).*$
windowrule = center 1, title:^(Select a File).*$
windowrule = size 70% 60%, title:^(Select a File).*$

windowrule = float 1, title:^(Choose wallpaper).*$
windowrule = center 1, title:^(Choose wallpaper).*$
windowrule = size 70% 60%, title:^(Choose wallpaper).*$

windowrule = float 1, title:^(Open Folder).*$
windowrule = center 1, title:^(Open Folder).*$
windowrule = size 70% 60%, title:^(Open Folder).*$

windowrule = float 1, title:^(Save As).*$
windowrule = center 1, title:^(Save As).*$
windowrule = size 70% 60%, title:^(Save As).*$

windowrule = float 1, title:^(Library).*$
windowrule = center 1, title:^(Library).*$
windowrule = size 70% 60%, title:^(Library).*$

windowrule = float 1, title:^(File Upload).*$
windowrule = center 1, title:^(File Upload).*$
windowrule = size 70% 60%, title:^(File Upload).*$

# -----------------------------------------------------
# Utilities
# -----------------------------------------------------
windowrule = float 1, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = center 1, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size 800 600, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float 1, class:^(blueman-manager)$
windowrule = center 1, class:^(blueman-manager)$
windowrule = float 1, class:^(nm-applet|nm-connection-editor)$
windowrule = center 1, class:^(nm-applet|nm-connection-editor)$
windowrule = size 800 600, class:^(nm-applet|nm-connection-editor)$
windowrule = float 1, class:^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$

# -----------------------------------------------------
# Picture-in-Picture
# -----------------------------------------------------
windowrule = float 1, title:^(Picture-in-Picture)$
windowrule = pin 1, title:^(Picture-in-Picture)$
windowrule = move 72% 72%, title:^(Picture-in-Picture)$
windowrule = size 25% 25%, title:^(Picture-in-Picture)$

# -----------------------------------------------------
# Bonus Common Rules
# -----------------------------------------------------
windowrule = float 1, class:^(thunar|nautilus|pcmanfm)$
windowrule = center 1, class:^(thunar|nautilus|pcmanfm)$
windowrule = opacity 0.9 0.8, floating:1