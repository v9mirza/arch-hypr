# V9-hyprdots Rules (Legacy Mode)
# Hyprland < 0.52 compatible

# -----------------------------------------------------
# General Window Rules
# -----------------------------------------------------

# Ignore maximize requests from apps.
# windowrule = suppressevent maximize, .*

# -----------------------------------------------------
# Layer Rules (Blur & Properties)
# -----------------------------------------------------

# Waybar
layerrule = blur,waybar
layerrule = ignore_alpha 1,waybar

# Wofi
layerrule = blur,wofi
layerrule = ignore_alpha 1,wofi

# Notifications
layerrule = blur,notifications
layerrule = ignore_alpha 1,notifications
layerrule = blur,dunst
layerrule = ignore_alpha 1,dunst
layerrule = blur,swaync-control-center
layerrule = ignore_alpha 1,swaync-control-center
layerrule = blur,swaync-notification-window
layerrule = ignore_alpha 1,swaync-notification-window

# -----------------------------------------------------
# Window Rules (Floating & Dialogs)
# -----------------------------------------------------

# Common Dialogs & File Pickers
windowrule = float, ^(Open File)(.*)$
windowrule = float, ^(Select a File)(.*)$
windowrule = float, ^(Choose wallpaper)(.*)$
windowrule = float, ^(Open Folder)(.*)$
windowrule = float, ^(Save As)(.*)$
windowrule = float, ^(Library)(.*)$
windowrule = float, ^(File Upload)(.*)$

# Common Utilities
windowrule = float, ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float, ^(blueman-manager)$
windowrule = float, ^(nm-applet|nm-connection-editor)$
windowrule = float, ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, ^(polkit-gnome-authentication-agent-1)$

# Center floating windows
windowrule = center, ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = center, ^(blueman-manager)$
windowrule = center, ^(nm-applet|nm-connection-editor)$

# Size adjustments for specific apps
windowrule = size 800 600, ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size 800 600, ^(nm-applet|nm-connection-editor)$

# -----------------------------------------------------
# Media & Picture-in-Picture
# -----------------------------------------------------

windowrule = float, ^(Picture-in-Picture)$
windowrule = pin, ^(Picture-in-Picture)$
windowrule = move 72% 72%, ^(Picture-in-Picture)$
windowrule = size 25% 25%, ^(Picture-in-Picture)$
