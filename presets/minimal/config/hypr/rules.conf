# V9-hyprdots Rules - Updated for Hyprland 2026 (V2 syntax)
# See https://wiki.hyprland.org/Configuring/Window-Rules/ [web:4]

# -----------------------------------------------------
# Dialogs & File Pickers (title regex - full match)
# -----------------------------------------------------
windowrule = float center size 70% 60%, title:(Open File).*$
windowrule = float center size 70% 60%, title:(Select a File).*$
windowrule = float center size 70% 60%, title:(Choose wallpaper).*$
windowrule = float center size 70% 60%, title:(Open Folder).*$
windowrule = float center size 70% 60%, title:(Save As).*$
windowrule = float center size 70% 60%, title:(Library).*$
windowrule = float center size 70% 60%, title:(File Upload).*$

# -----------------------------------------------------
# Utilities (class regex - pavucontrol, blueman, network)
# -----------------------------------------------------
windowrule = float center size 800 600, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float center, class:blueman-manager
windowrule = float center size 800 600, class:^(nm-applet|nm-connection-editor)$
windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$

# -----------------------------------------------------
# Picture-in-Picture
# -----------------------------------------------------
windowrule = float pin move 72% 72% size 25% 25% keepaspectratio opacity 0.95 0.75, title:^(Picture-in-Picture)$

# -----------------------------------------------------
# Bonus: Common Additions (file managers, terminals, etc.)
# -----------------------------------------------------
windowrule = float center, class:^(thunar|org.gnome.Nautilus|pcmanfm-qt)$
windowrule = float center size 65% 90%, class:^(Alacritty|kitty)$
windowrule = workspace 2 silent, class:^(firefox|google-chrome|chromium)$
windowrule = opacity 0.9 0.8 0.8 0.7, floating:1
windowrule = idleinhibit fullscreen, fullscreen:1

# -----------------------------------------------------
# Layer Rules (notifications, rofi)
# -----------------------------------------------------
layerrule = blur ignorezero, rofi
layerrule = blur ignorezero, notifications