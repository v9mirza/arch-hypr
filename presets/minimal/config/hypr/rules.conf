# V9-hyprdots Rules - Hyprland WindowRule Syntax (2026)
# Matches use match: prefix for properties (e.g., match:class ...). Boolean flags require value (e.g. float 1).

# -----------------------------------------------------
# Dialogs & File Pickers
# -----------------------------------------------------
windowrule = float 1, match:title:^(Open File).*$
windowrule = center 1, match:title:^(Open File).*$
windowrule = size 70% 60%, match:title:^(Open File).*$

windowrule = float 1, match:title:^(Select a File).*$
windowrule = center 1, match:title:^(Select a File).*$
windowrule = size 70% 60%, match:title:^(Select a File).*$

windowrule = float 1, match:title:^(Choose wallpaper).*$
windowrule = center 1, match:title:^(Choose wallpaper).*$
windowrule = size 70% 60%, match:title:^(Choose wallpaper).*$

windowrule = float 1, match:title:^(Open Folder).*$
windowrule = center 1, match:title:^(Open Folder).*$
windowrule = size 70% 60%, match:title:^(Open Folder).*$

windowrule = float 1, match:title:^(Save As).*$
windowrule = center 1, match:title:^(Save As).*$
windowrule = size 70% 60%, match:title:^(Save As).*$

windowrule = float 1, match:title:^(Library).*$
windowrule = center 1, match:title:^(Library).*$
windowrule = size 70% 60%, match:title:^(Library).*$

windowrule = float 1, match:title:^(File Upload).*$
windowrule = center 1, match:title:^(File Upload).*$
windowrule = size 70% 60%, match:title:^(File Upload).*$

# -----------------------------------------------------
# Utilities
# -----------------------------------------------------
windowrule = float 1, match:class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = center 1, match:class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size 800 600, match:class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float 1, match:class:^(blueman-manager)$
windowrule = center 1, match:class:^(blueman-manager)$
windowrule = float 1, match:class:^(nm-applet|nm-connection-editor)$
windowrule = center 1, match:class:^(nm-applet|nm-connection-editor)$
windowrule = size 800 600, match:class:^(nm-applet|nm-connection-editor)$
windowrule = float 1, match:class:^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$

# -----------------------------------------------------
# Picture-in-Picture
# -----------------------------------------------------
windowrule = float 1, match:title:^(Picture-in-Picture)$
windowrule = pin 1, match:title:^(Picture-in-Picture)$
windowrule = move 72% 72%, match:title:^(Picture-in-Picture)$
windowrule = size 25% 25%, match:title:^(Picture-in-Picture)$

# -----------------------------------------------------
# Bonus Common Rules
# -----------------------------------------------------
windowrule = float 1, match:class:^(thunar|nautilus|pcmanfm)$
windowrule = center 1, match:class:^(thunar|nautilus|pcmanfm)$
windowrule = opacity 0.9 0.8, match:floating 1