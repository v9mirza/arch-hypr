# V9-hyprdots Rules (Safe Mode)
# Hyprland >= 0.52 compatible

# -----------------------------------------------------
# General Window Rules
# -----------------------------------------------------

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# -----------------------------------------------------
# Layer Rules (Blur & Properties)
# -----------------------------------------------------

# Waybar
layerrule = blur, waybar
layerrule = ignore_alpha 1, waybar

# Wofi
layerrule = blur, wofi
layerrule = ignore_alpha 1, wofi

# Notifications (Dunst / Mako / Swaync)
layerrule = blur, notifications
layerrule = ignore_alpha 1, notifications
layerrule = blur, dunst
layerrule = ignore_alpha 1, dunst
layerrule = blur, swaync-control-center
layerrule = ignore_alpha 1, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignore_alpha 1, swaync-notification-window

# -----------------------------------------------------
# Window Rules (Floating & Dialogs)
# -----------------------------------------------------

# Common Dialogs & File Pickers
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Select a File)(.*)$
windowrulev2 = float, title:^(Choose wallpaper)(.*)$
windowrulev2 = float, title:^(Open Folder)(.*)$
windowrulev2 = float, title:^(Save As)(.*)$
windowrulev2 = float, title:^(Library)(.*)$
windowrulev2 = float, title:^(File Upload)(.*)$

# Common Utilities
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-applet|nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$

# Center floating windows
windowrulev2 = center, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = center, class:^(nm-applet|nm-connection-editor)$

# Size adjustments for specific apps
windowrulev2 = size 800 600, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = size 800 600, class:^(nm-applet|nm-connection-editor)$

# -----------------------------------------------------
# Media & Picture-in-Picture
# -----------------------------------------------------

windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 72% 72%, title:^(Picture-in-Picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture)$
