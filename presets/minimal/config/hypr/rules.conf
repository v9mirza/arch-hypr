# V9-hyprdots Rules (Modern Syntax)
# Hyprland >= 0.40

# -----------------------------------------------------
# Window Rules (Floating & Dialogs)
# -----------------------------------------------------

# Common Dialogs & File Pickers (match by title)
windowrule = float, title:^(Open File)(.*)$
windowrule = float, title:^(Select a File)(.*)$
windowrule = float, title:^(Choose wallpaper)(.*)$
windowrule = float, title:^(Open Folder)(.*)$
windowrule = float, title:^(Save As)(.*)$
windowrule = float, title:^(Library)(.*)$
windowrule = float, title:^(File Upload)(.*)$

# -----------------------------------------------------
# Common Utilities (match by class)
# -----------------------------------------------------

windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-applet|nm-connection-editor)$
windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1)$

# Center floating windows
windowrule = center, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = center, class:^(blueman-manager)$
windowrule = center, class:^(nm-applet|nm-connection-editor)$

# Size adjustments
windowrule = size 800 600, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size 800 600, class:^(nm-applet|nm-connection-editor)$

# -----------------------------------------------------
# Media & Picture-in-Picture
# -----------------------------------------------------

windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = move 72% 72%, title:^(Picture-in-Picture)$
windowrule = size 25% 25%, title:^(Picture-in-Picture)$