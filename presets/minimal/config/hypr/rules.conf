# V9-hyprdots Rules - Hyprland V2 Syntax (2026)
# Matches are regex after comma; no class:/title: prefixes!

# -----------------------------------------------------
# Dialogs & File Pickers
# -----------------------------------------------------
windowrulev2 = float, title:regex^(Open File).*$
windowrulev2 = center, title:regex^(Open File).*$
windowrulev2 = size 70% 60%, title:regex^(Open File).*$

windowrulev2 = float, title:regex^(Select a File).*$
windowrulev2 = center, title:regex^(Select a File).*$
windowrulev2 = size 70% 60%, title:regex^(Select a File).*$

windowrulev2 = float, title:regex^(Choose wallpaper).*$
windowrulev2 = center, title:regex^(Choose wallpaper).*$
windowrulev2 = size 70% 60%, title:regex^(Choose wallpaper).*$

windowrulev2 = float, title:regex^(Open Folder).*$
windowrulev2 = center, title:regex^(Open Folder).*$
windowrulev2 = size 70% 60%, title:regex^(Open Folder).*$

windowrulev2 = float, title:regex^(Save As).*$
windowrulev2 = center, title:regex^(Save As).*$
windowrulev2 = size 70% 60%, title:regex^(Save As).*$

windowrulev2 = float, title:regex^(Library).*$
windowrulev2 = center, title:regex^(Library).*$
windowrulev2 = size 70% 60%, title:regex^(Library).*$

windowrulev2 = float, title:regex^(File Upload).*$
windowrulev2 = center, title:regex^(File Upload).*$
windowrulev2 = size 70% 60%, title:regex^(File Upload).*$

# -----------------------------------------------------
# Utilities
# -----------------------------------------------------
windowrulev2 = float center size 800 600, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = float center, class:^(blueman-manager)$
windowrulev2 = float center size 800 600, class:^(nm-applet|nm-connection-editor)$
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$

# -----------------------------------------------------
# Picture-in-Picture
# -----------------------------------------------------
windowrulev2 = float pin move 72% 72% size 25% 25%, title:^(Picture-in-Picture)$

# -----------------------------------------------------
# Bonus Common Rules
# -----------------------------------------------------
windowrulev2 = float center, class:^(thunar|nautilus|pcmanfm)$
windowrulev2 = opacity 0.9 0.8, floating:1