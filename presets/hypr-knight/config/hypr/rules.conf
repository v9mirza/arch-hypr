# V9-hyprdots Rules - Hyprland WindowRule Syntax (2026)
# WindowRuleV2 deprecated. Using windowrule match:prop value, effect value syntax.

# -----------------------------------------------------
# Dialogs & File Pickers
# -----------------------------------------------------
windowrule = match:title ^(Open File).*, float 1
windowrule = match:title ^(Open File).*, center 1
windowrule = match:title ^(Open File).*, size 70% 60%

windowrule = match:title ^(Select a File).*, float 1
windowrule = match:title ^(Select a File).*, center 1
windowrule = match:title ^(Select a File).*, size 70% 60%

windowrule = match:title ^(Choose wallpaper).*, float 1
windowrule = match:title ^(Choose wallpaper).*, center 1
windowrule = match:title ^(Choose wallpaper).*, size 70% 60%

windowrule = match:title ^(Open Folder).*, float 1
windowrule = match:title ^(Open Folder).*, center 1
windowrule = match:title ^(Open Folder).*, size 70% 60%

windowrule = match:title ^(Save As).*, float 1
windowrule = match:title ^(Save As).*, center 1
windowrule = match:title ^(Save As).*, size 70% 60%

windowrule = match:title ^(Library).*, float 1
windowrule = match:title ^(Library).*, center 1
windowrule = match:title ^(Library).*, size 70% 60%

windowrule = match:title ^(File Upload).*, float 1
windowrule = match:title ^(File Upload).*, center 1
windowrule = match:title ^(File Upload).*, size 70% 60%

# -----------------------------------------------------
# Utilities
# -----------------------------------------------------
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, float 1
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, center 1
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, size 800 600
windowrule = match:class ^(blueman-manager)$, float 1
windowrule = match:class ^(blueman-manager)$, center 1
windowrule = match:class ^(nm-applet|nm-connection-editor)$, float 1
windowrule = match:class ^(nm-applet|nm-connection-editor)$, center 1
windowrule = match:class ^(nm-applet|nm-connection-editor)$, size 800 600
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1)$, float 1

# -----------------------------------------------------
# Picture-in-Picture
# -----------------------------------------------------
windowrule = match:title ^(Picture-in-Picture)$, float 1
windowrule = match:title ^(Picture-in-Picture)$, pin 1
windowrule = match:title ^(Picture-in-Picture)$, move 72% 72%
windowrule = match:title ^(Picture-in-Picture)$, size 25% 25%

# -----------------------------------------------------
# Bonus Common Rules
# -----------------------------------------------------
windowrule = match:class ^(thunar|nautilus|pcmanfm)$, float 1
windowrule = match:class ^(thunar|nautilus|pcmanfm)$, center 1
windowrule = match:float 1, opacity 0.9 0.8