# hyprlock.conf
# "The Void" - Modern Black Aesthetic

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# 1. Background (Blurred Screenshot)
background {
    monitor =
    path = screenshot
    color = rgba(18, 18, 18, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 2. Sidebar Container (Left)
shape {
    monitor =
    size = 420, 100%
    color = rgba(0, 0, 0, 0.4)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
    zindex = 0
}

# 3. Time (Massive, Bottom-Left inside sidebar)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = JetBrains Mono ExtraBold
    position = 40, 60
    halign = left
    valign = bottom
    zindex = 1
}

# 4. Date (Above Time)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d" | tr '[:lower:]' '[:upper:]')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = JetBrains Mono Bold
    position = 50, 320
    halign = left
    valign = bottom
    zindex = 1
}

# 5. Weather (Top-Left inside sidebar)
label {
    monitor =
    text = cmd[update:1800000] echo "<b>$(curl -s 'wttr.in?format=%C+%t' 2>/dev/null)</b>"
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 50, -50
    halign = left
    valign = top
    zindex = 1
}

# 6. Status Indicator (Top Right - Outside Sidebar)
label {
    monitor =
    text = SYSTEM LOCKED
    color = rgba(255, 255, 255, 0.4)
    font_size = 15
    font_family = JetBrains Mono Medium
    position = -50, -50
    halign = right
    valign = top
    zindex = 1
}

# 7. User Greeting (Inside Sidebar)
label {
    monitor =
    text = HELLO, $USER
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 60, 480
    halign = left
    valign = bottom
    zindex = 1
}

# 8. Input Field (Inside Sidebar)
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(73, 169, 166, 0.5)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 50, 400
    halign = left
    valign = bottom
    rounding = 16
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    zindex = 1
}

# 9. Media Player (Bottom Left inside sidebar)
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{title}}  {{artist}}' 2>/dev/null)"
    color = rgba(255, 255, 255, 0.5)
    font_size = 13
    font_family = JetBrains Mono Medium
    position = 50, 30
    halign = left
    valign = bottom
    zindex = 1
}

# 10. Battery (Top Right - Outside Sidebar)
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)% ⚡"
    color = rgba(255, 255, 255, 0.4)
    font_size = 14
    font_family = JetBrains Mono Medium
    position = -50, -80
    halign = right
    valign = top
    zindex = 1
}
