# hyprlock.conf
# "The Void" - Modern Black Aesthetic

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# 1. Background (Blurred Screenshot)
background {
    monitor =
    path = screenshot
    color = rgba(18, 18, 18, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 2. Date (Bottom Left - Above Time)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d" | tr '[:lower:]' '[:upper:]')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = JetBrains Mono ExtraBold
    position = 50, 260
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
}

# 3. Time (Massive, Bottom-Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = JetBrains Mono ExtraBold
    position = 40, 40
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(0,0,0)
}

# 4. User Greeting (Center, Lower)
label {
    monitor =
    text = HELLO, $USER
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 0, 100
    halign = center
    valign = bottom
    shadow_passes = 1
}

# 5. Input Field (Bottom Center)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(73, 169, 166, 0.8)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 40
    halign = center
    valign = bottom
    rounding = 16
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    shadow_passes = 2
}

# 6. Status Indicator (Top Right)
label {
    monitor =
    text = SYSTEM LOCKED
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = -40, -40
    halign = right
    valign = top
    shadow_passes = 1
}

# 7. Security Level (Below Status)
label {
    monitor =
    text = SECURITY LEVEL: MAX
    color = rgba(255, 255, 255, 0.4)
    font_size = 10
    font_family = JetBrains Mono Medium
    position = -40, -70
    halign = right
    valign = top
    shadow_passes = 1
}

# 8. Media Player (Bottom Center - Above Input)
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{title}}  {{artist}}' 2>/dev/null)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = JetBrains Mono Medium
    position = 0, 10
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 2
}

