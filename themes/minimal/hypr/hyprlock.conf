# hyprlock.conf
# "The Void" - Modern Black Aesthetic

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# 1. Background (Blurred Screenshot)
background {
    monitor =
    path = screenshot
    color = rgba(18, 18, 18, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 2. Time (Massive, Bottom-Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 200
    font_family = JetBrains Mono ExtraBold
    position = 50, 0
    halign = left
    valign = bottom
}

# 3. Date (Above Time)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 25
    font_family = JetBrains Mono Bold
    position = 60, 280
    halign = left
    valign = bottom
}

# 4. Status Indicator (Top Right)
label {
    monitor =
    text = SYSTEM LOCKED
    color = rgba(255, 255, 255, 0.4)
    font_size = 15
    font_family = JetBrains Mono Medium
    position = -50, -50
    halign = right
    valign = top
}

# 5. Security Level (Top Right, under Status)
label {
    monitor =
    text = SECURITY LEVEL: MAX
    color = rgba(255, 255, 255, 0.4)
    font_size = 12
    font_family = JetBrains Mono Medium
    position = -50, -25
    halign = right
    valign = top
}



# 6. User Greeting (Center, Below Avatar)
label {
    monitor =
    text = HELLO, $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 16
    font_family = JetBrains Mono Bold
    position = 0, 20
    halign = center
    valign = center
}

# 7. Input Field (Rounded & Styled)
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
    rounding = 20
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
}
