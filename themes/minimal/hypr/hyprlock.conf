# hyprlock.conf
# "The Void" - Modern Black Aesthetic

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# 1. Background (Blurred Screenshot)
background {
    monitor =
    path = screenshot
    color = rgba(18, 18, 18, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 2. Weather (Top-Left)
label {
    monitor =
    text = cmd[update:1800000] echo "<b>$(curl -s 'wttr.in?format=%C+%t' 2>/dev/null)</b>"
    color = rgba(255, 255, 255, 0.9)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 50, -50
    halign = left
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
}

# 3. Time (Massive, Bottom-Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = JetBrains Mono ExtraBold
    position = 50, 60
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(0,0,0)
}

# 4. Date (Above Time)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d" | tr '[:lower:]' '[:upper:]')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = JetBrains Mono ExtraBold
    position = 60, 320
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
}

# 5. Status Indicator (Center Top)
label {
    monitor =
    text = SYSTEM LOCKED
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrains Mono Medium
    position = 0, -50
    halign = center
    valign = top
    shadow_passes = 1
}

# 6. User Greeting (Bottom Left, above date)
label {
    monitor =
    text = HELLO, $USER
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 60, 360
    halign = left
    valign = bottom
    shadow_passes = 1
}

# 7. Input Field (Bottom Left)
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(73, 169, 166, 0.8)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 50, 420
    halign = left
    valign = bottom
    rounding = 16
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    shadow_passes = 2
}

# 8. Media Player (Bottom Center)
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{title}}  {{artist}}' 2>/dev/null)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = JetBrains Mono Medium
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 2
}

# 9. Battery (Top Right - Text Only)
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%  $(cat /sys/class/power_supply/BAT0/status 2>/dev/null)"
    color = rgba(255, 255, 255, 0.8)
    font_size = 14
    font_family = JetBrains Mono Medium
    position = -50, -50
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 3
}

